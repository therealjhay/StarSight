[package]
name = "starsight-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "starsight-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
# Stellar key encoding/decoding (S.../G... strkeys).
stellar-strkey = "0.0.10"
# Ed25519 signing for Soroban transaction envelopes.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# XDR types for Soroban transaction construction (used in helpers).
stellar-xdr = { version = "22", features = ["std", "serde"] }
