[package]
name = "starsight-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "starsight-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
# Note: We use stellar-xdr for parsing Soroban event XDR data.
# stellar-sdk is not available as a standalone pure-Rust crate; stellar-xdr
# provides the low-level XDR types needed to decode contract events.
stellar-xdr = { version = "22", features = ["std", "serde"] }
